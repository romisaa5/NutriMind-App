name: nutri_mind
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  get_it: ^9.2.1
  flutter_svg: ^2.3.0
  go_router: ^17.3.0

  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  flutter_animate: ^4.5.2
  animate_do: ^5.1.0
  fl_chart: ^1.2.0
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  top_snackbar_flutter: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  intl_utils: ^2.8.13

flutter_intl:
  enabled: true
  main_locale: en

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: "Cairo"
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
